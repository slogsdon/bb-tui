# One tag ships both halves. The plugin and the client are versioned in
# lockstep and published together, so `npm:bb-plugin-bb-tui@X`,
# `git:…@X`, and `bb-tui@X` on npm always describe the same commit.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # bb downloads its plugin build toolchain on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.bb/plugins/toolchain-*
          key: bb-toolchain-${{ hashFiles('bb-plugin-bb-tui/package-lock.json') }}

      - run: npm --prefix bb-plugin-bb-tui ci
      - run: npm --prefix client ci

      - name: versions agree (with each other, and with the tag)
        run: scripts/check-versions.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - run: npm --prefix bb-plugin-bb-tui run typecheck
      - run: npm --prefix bb-plugin-bb-tui test
      - run: npm --prefix client run typecheck
      - run: npm --prefix client test

      # Build both artifacts on every run, not just on tags: a publish-time-only
      # build failure is one nobody sees until the release is already tagged.
      - name: build the plugin artifact
        run: |
          npm --prefix bb-plugin-bb-tui run build
          test -s bb-plugin-bb-tui/dist/server.js
          node -e '
            const m = require("./bb-plugin-bb-tui/dist/server.meta.json");
            const p = require("./bb-plugin-bb-tui/package.json");
            if (m.pluginVersion !== p.version) {
              throw new Error(`artifact ${m.pluginVersion} != manifest ${p.version}`);
            }
          '

      - name: build the client
        run: |
          npm --prefix client run build
          test -s client/dist/index.js
          test -s client/dist/cli.js

      # `files` in each package.json is what actually ships; dist/ is gitignored,
      # and npm falls back to .gitignore without an allowlist. Fail loudly here
      # rather than publishing a plugin with no artifact in it.
      # `npm pack`/`publish` ignore --prefix and read the cwd's package.json.
      - name: the tarballs contain what they claim
        run: |
          (cd bb-plugin-bb-tui && npm pack --dry-run --json) > /tmp/plugin-pack.json
          (cd client && npm pack --dry-run --json) > /tmp/client-pack.json
          node -e '
            const has = (f, want) => {
              const files = require(f)[0].files.map((e) => e.path);
              for (const w of want) {
                if (!files.includes(w)) throw new Error(`${f} is missing ${w}`);
              }
            };
            has("/tmp/plugin-pack.json", ["package.json", "server.ts", "dist/server.js"]);
            has("/tmp/client-pack.json", ["package.json", "dist/index.js", "dist/cli.js"]);
          '

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd bb-plugin-bb-tui && npm publish --provenance --access public)
          (cd client && npm publish --provenance --access public)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
